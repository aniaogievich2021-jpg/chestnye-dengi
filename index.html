  return c;
}

let ac = null, muted = false;

function wake() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    wake();
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    v.gain.value = vol || 0.05; v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(v); v.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}

function sweep(f0, f1, dur, type, vol, delay) {
  if (muted) return;
  try {
    wake();
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), v = ac.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    v.gain.setValueAtTime(vol || 0.05, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(v); v.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function noise(dur, vol, delay) {
  if (muted) return;
  try {
    wake();
    const t0 = ac.currentTime + (delay || 0), n = Math.max(1, (ac.sampleRate * dur) | 0), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(), v = ac.createGain();
    src.buffer = b; v.gain.setValueAtTime(vol, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(v); v.connect(ac.destination); src.start(t0);
  } catch (e) {}
}
function seq(notes, type, vol) { notes.forEach(n => sweep(n[0], n[0], n[2] || 0.12, type, vol, n[1])); }

// calm 8-bit background loop: arpeggio (square) + bass (triangle), chords Am-F-C-G
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [{ b: 45, a: [69, 72, 76, 72] }, { b: 41, a: [65, 69, 72, 69] }, { b: 48, a: [67, 72, 76, 72] }, { b: 43, a: [67, 71, 74, 71] }];
const MSTEP = 0.24; let mNext = 0, mStep = 0;
function tone(f, t0, dur, type, vol) {
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.value = f;
  v.gain.setValueAtTime(vol, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(v); v.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
}
function music() {
  const okState = state === "name" || state === "play" || state === "quiz" || state === "safe" || state === "win" || state === "title" || state === "help" || state === "levels" || state === "review";
  if (muted || !ac || ac.state !== "running" || !okState) { mNext = 0; return; }
  const now = ac.currentTime;
  if (!mNext || mNext < now) mNext = now + 0.05;
  while (mNext < now + 0.25) {
    const c = CH[((mStep / 8) | 0) % 4], k = mStep % 8;
    tone(mf(c.a[k % 4]), mNext, MSTEP * 0.9, "square", 0.018);
    if (k % 4 === 0) tone(mf(c.b), mNext, MSTEP * 3.6, "triangle", 0.05);
    mNext += MSTEP; mStep++;
  }
}

function spawn() {
  let type;
  const d = eff() - 1;                              // 0..8: difficulty step
  if (Math.random() < 0.5 + d * 0.012) {

    if (eff() >= 6) pool = pool.concat(pool.filter(b => b.id === "bag" || b.id === "snake"));  // tougher mix later

  } else type = GOODS[(Math.random() * GOODS.length) | 0];
  const name = type.names ? type.names[(Math.random() * type.names.length) | 0] : "";
  txs.push({ x: 8 + Math.random() * (W - 32), y: 15, type, name, sz: 16, hp: type.hp || 1, ph: Math.random() * 6, wob: Math.random() < 0.2 + d * 0.05 });
}

function update(dt) {
  t += dt;

  player.cd -= dt; spreadT -= dt; freezeT -= dt; flash -= dt;
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  if ((keys.has(" ") || keys.has("ArrowUp") || ptr.on) && player.cd <= 0) {
    if (spreadT > 0) [-40, 0, 40].forEach(v => shots.push({ x: player.x + 5, y: player.y - 2, vx: v }));
    else shots.push({ x: player.x + 5, y: player.y - 2, vx: 0 });
    player.cd = 0.2; player.fl = 0.08; beep(880, .05, "square", .03);
  }
  // calm pace: slow spawn, gentle speed-up with a cap
  if (tutT > 0) { tutT -= dt; if (tutT <= 0) spawnT = 0.6; }
  else { spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(1.3, 2.2 - (eff() - 1) * 0.1) * (0.85 + Math.random() * 0.4); } }
  const fall = (16 + (eff() - 1) * 2.2) * (freezeT > 0 ? 0.35 : 1) * (tutT > 0 ? 0.8 : 1);
  shots.forEach(s => { s.y -= 200 * dt; s.x += s.vx * dt; });
  shots = shots.filter(s => s.y > 12 && s.x > 0 && s.x < W);
  for (const q of txs) {
    q.y += fall * dt; q.ph += dt * 3;
    if (q.type.id === "snake") q.x += Math.sin(q.ph * 1.4) * (22 + eff() * 2) * dt;
    else if (q.wob) q.x += Math.sin(q.ph) * 14 * dt;
    q.x = Math.max(1, Math.min(W - q.sz - 1, q.x));
  }
  // shots vs things
  for (const s of shots) for (const q of txs) {
    if (q.dead || s.dead) continue;
    if (s.x > q.x - 2 && s.x < q.x + q.sz + 2 && s.y > q.y && s.y < q.y + q.sz) {
      s.dead = true; q.hp--;
      const cx = q.x + q.sz / 2, cy = q.y + q.sz / 2;
      if (q.hp > 0) { burst(cx, cy, P.y, 6); say(cx - 8, q.y, "ЕЩЁ РАЗ!", P.y); sweep(500, 200, .12, "square", .05); continue; }
      q.dead = true;
      if (q.type.bad) {
        combo++; const pts = 100 * Math.min(combo, 5); score += pts; kills++; lvlCaught++; award("first"); if (combo >= 10) award("streak10");
        burst(cx, cy, q.type.col, 14); say(cx - 10, q.y, "ПОЙМАН! +" + pts, P.y); (SFX[q.type.id] || (() => beep(520, .1)))(); beep(900 + Math.min(combo, 8) * 80, .06, "triangle", .03);
        if (Math.random() < 0.2) pus.push({ x: cx - 5, y: q.y, type: POWERS[(Math.random() * POWERS.length) | 0] });
      } else {
        combo = 0; falsePos++; lvlFP++; score = Math.max(0, score - 150); shake = 0.2;
        burst(cx, cy, P.o, 10); say(cx - 20, q.y, "ОЙ, ЭТО ЧЕСТНЫЙ! -150", P.R); sweep(420, 160, .3, "sawtooth", .07); sweep(330, 120, .3, "sawtooth", .06, .25);
        toast = { text: GOOD_HINTS[falsePos % GOOD_HINTS.length], life: 5 };
      }
    }
  }
  shots = shots.filter(s => !s.dead);
  if (lvlCaught >= GOAL) { finishLevel(); return; }
  // reaching the red line
  for (const q of txs) {
    if (!q.dead && q.y + q.sz >= 184) {
      q.dead = true;
      if (q.type.bad) { missed++; lvlMiss++; burst(q.x + 8, 176, P.r, 12); loseLife("УГРОЗА ПРОШЛА: -1 ЖИЗНЬ");
        if (!toast) toast = { text: "Пропущенная угроза — это риск для клиентов. Подозрительные операции нужно останавливать до того, как они дойдут до конца.", life: 4.5 }; }
      else { score += 10; say(q.x - 4, 168, "+10 ПРОШЁЛ", P.o); }
    }
  }
  txs = txs.filter(q => !q.dead);
  // power-ups
  for (const p of pus) {
    p.y += 28 * dt;
    if (p.y + 11 >= player.y && p.y < player.y + 12 && p.x + 11 > player.x && p.x < player.x + 12) {

  }
  pus = pus.filter(p => !p.dead);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 14 * dt; f.life -= dt; });
  floaters = floaters.filter(f => f.life > 0);
  rain.forEach(r => { r.y += r.v * dt; if (r.y > H) { r.y = -10; r.x = Math.random() * W; } });
  if (shake > 0) shake -= dt;
}

      const bob = Math.sin(t * (q.type.bad ? 7 : 3) + q.ph) * 2, bx = (q.x * S) | 0, by = ((q.y * S) + bob) | 0;
      ctx.drawImage(q.type.spr, bx, by, q.sz * S, q.sz * S);
      const eyes = EYES[q.type.id];
      if (eyes) {
        if (q.seed === undefined) q.seed = Math.random() * 5;
        const pp = q.sz * S / 12, on = ((t * 1.2 + q.seed) % 1) < 0.6;
        eyes.forEach(e => {
          if (on) { ctx.fillStyle = "rgba(255,60,60,.35)"; ctx.fillRect(bx + e[0] * pp - 3, by + e[1] * pp - 3, e[2] * pp + 6, pp + 6); }
          ctx.fillStyle = on ? "#ff3030" : P.k; ctx.fillRect(bx + e[0] * pp, by + e[1] * pp, e[2] * pp, pp);
          if (on) { ctx.fillStyle = P.y; ctx.fillRect(bx + e[0] * pp, by + e[1] * pp, 2, 2); }
        });
      }
      if (q.tut && tutT > 0) text(q.tut === "bad" ? "УГРОЗА — СТРЕЛЯЙТЕ!" : "КЛИЕНТ — ПРОПУСТИТЕ", cx, q.y * S - 10, 13, q.tut === "bad" ? P.R : P.o, "center");
      if (q.type.bad) text(q.name, cx, (q.y + q.sz) * S + 14, 11, q.type.col, "center");
      else if (Math.sin(t * 5 + q.ph) > 0.7) { ctx.fillStyle = P.w; ctx.fillRect(cx + 22, cy - 26, 4, 4); ctx.fillRect(cx - 28, cy - 10, 3, 3); }
    }
    floaters.forEach(f => text(f.text, f.x * S, f.y * S, 12, f.col));
  }
  ctx.restore();
  if (flash > 0 && state === "play") { ctx.fillStyle = "rgba(177,62,83," + Math.min(.45, flash * 1.4) + ")"; ctx.fillRect(0, 0, 900, 600); }

  if (state !== "title" && state !== "help") {
    text("ОЧКИ " + String(score).padStart(6, "0"), 10, 30, 16, P.w);
    text("УРОВЕНЬ " + level + "/" + MAXLVL, 190, 30, 16, P.B);
    text("УГРОЗЫ " + lvlCaught + "/" + GOAL, 345, 30, 16, P.y);
    ctx.drawImage(amulet, 480, 8, 24, 24); text("x" + amulets, 510, 30, 16, P.B);
    text("ЖИЗНИ", 640, 30, 16, P.s);
    if (muted) text("ЗВУК ВЫКЛ (M)", 890, 590, 12, P.S, "right");
    let hy = 70;
    if (spreadT > 0) { text("ТРОЙНОЙ ВЫСТРЕЛ " + Math.ceil(spreadT) + "s", 10, hy, 13, P.B); hy += 18; }
    if (freezeT > 0) { text("ЗАМЕДЛЕНИЕ " + Math.ceil(freezeT) + "s", 10, hy, 13, P.g); }
    if (tutT > 0 && state === "play" && !toast) text("Обучение: ← → движение · ПРОБЕЛ — огонь", 450, 78, 15, P.y, "center");
    if (toast && state === "play") {
      ctx.fillStyle = "rgba(15,15,27,.9)"; ctx.fillRect(40, 48, 820, 56);
      ctx.fillStyle = P.o; ctx.fillRect(40, 48, 820, 3);
      wrap(toast.text, 88).forEach((ln, i) => text(ln, 450, 74 + i * 20, 14, P.w, "center"));
    }
    if (banner && state === "play") {
      ctx.fillStyle = "rgba(15,15,27,.85)"; ctx.fillRect(40, 225, 820, 124);
      ctx.fillStyle = P.y; ctx.fillRect(40, 225, 820, 3); ctx.fillRect(40, 346, 820, 3);
      text(banner.title, 450, 270, 34, P.y, "center");
      wrap(banner.fact, 82).forEach((ln, i) => text(ln, 450, 306 + i * 22, 16, P.w, "center"));
    }
  }

  if (state === "title") {
    ctx.fillStyle = "rgba(15,15,27,.86)"; ctx.fillRect(0, 0, 900, 600);
    text("ЧЕСТНЫЕ ДЕНЬГИ", 450, 115, 58, P.y, "center");
    text("тренажёр по финансовой безопасности", 450, 152, 20, P.B, "center");
    ctx.drawImage(officer, 414, 175, 72, 72);
    text("Вы — специалист службы комплаенса.", 450, 292, 20, P.w, "center");
    text("Ваша задача — защищать клиентов и компанию от мошенничества", 450, 328, 16, P.s, "center");
    text("и денег незаконного происхождения: блокировать подозрительные", 450, 351, 16, P.s, "center");
    text("операции и пропускать законные.", 450, 374, 16, P.s, "center");
    text(MAXLVL + " уровней. После каждого — короткий тест о том, как отличить", 450, 418, 16, P.w, "center");
    text("запрос комплаенса от действий мошенников.", 450, 441, 16, P.w, "center");
    text("← →  движение      ПРОБЕЛ  огонь", 450, 495, 18, P.y, "center");
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ДАЛЕЕ", 450, 555, 26, P.w, "center");
    if (best) text("РЕКОРД " + best, 880, 585, 14, P.s, "right");
    text("L — выбор уровня" + (unlocked > 1 ? " (открыто " + unlocked + ")" : ""), 20, 585, 14, P.s);
    text("A — достижения (" + achCount() + "/" + ACH.length + ")", 20, 563, 14, P.s);
  } else if (state === "help") {
    ctx.fillStyle = "rgba(15,15,27,.95)"; ctx.fillRect(0, 0, 900, 600);
    text("КАК ИГРАТЬ", 450, 48, 32, P.y, "center");
    GOODS.forEach((gd, i) => ctx.drawImage(gd.spr, 50 + i * 48, 66, 40, 40));
    text("Милые картинки — честные клиенты. Пропускайте:", 260, 92, 16, P.o);
    text("ошибочный выстрел — штраф.", 260, 112, 14, P.s);
    text("Подозрительное — сбивайте:", 50, 148, 15, P.R);
    const rows = [
      [B("skull"),  "САНКЦИОННАЯ ТРАНЗАКЦИЯ — перевод лицу из санкционного списка", P.w],
      [B("spider"), "ДАРКНЕТ — платёж на нелегальную площадку", P.p],
      [B("mask"),   "ВЫВОД МОШЕННИКУ — средства уходят обманщику", P.y],
      [B("bag"),    "ГРЯЗНЫЕ ДЕНЬГИ — незаконное происхождение (2 выстрела)", P.l],
      [B("snake"),  "ЗАПУТАННЫЙ СЛЕД — цепочка переводов скрывает источник", P.l]
    ];
    rows.forEach((r, i) => { ctx.drawImage(r[0].spr, 50, 160 + i * 44, 40, 40); text(r[1], 105, 187 + i * 44, 15, r[2]); });
    const py = 395;
    POWERS.forEach((p, i) => { ctx.drawImage(p.spr, 70 + i * 270, py, 33, 33); text(p.label, 112 + i * 270, py + 22, 13, P.w); });
    text("Угроза дошла до красной линии — минус жизнь.", 70, py + 60, 15, P.R);
    text("Сбейте " + GOAL + " угроз — уровень пройден, затем тест из 2–3 вопросов.", 70, py + 84, 15, P.y);
    text("Все ответы верны — защита усиливается: +1 жизнь и оберег.", 70, py + 108, 15, P.B);
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ИГРАТЬ", 450, 585, 24, P.w, "center");
  } else if (state === "quiz" && quiz) {
    ctx.fillStyle = "rgba(15,15,27,.95)"; ctx.fillRect(0, 0, 900, 600);
    ctx.drawImage(amulet, 215, 26, 36, 36);
    text("ОБЕРЕГ ОТ МОШЕННИКОВ", 450, 56, 30, P.y, "center");
    text("Уровень " + level + " пройден · вопрос " + quiz.idx + " из " + quiz.n, 450, 86, 15, P.s, "center");
    const ql = wrap(quiz.q, 62);
    ql.forEach((ln, i) => text(ln, 450, 130 + i * 28, 20, P.w, "center"));
    const top = 130 + ql.length * 28 + 6; quiz.top = top;
    quiz.opts.forEach((o, i) => {
      const y = top + i * 56;
      let bg = "#1a1c2c", bd = P.S;
      if (!quiz.done && i === quiz.sel) { bg = "#29366f"; bd = P.B; }
      if (quiz.done && o.ok) { bg = "#1b4d3a"; bd = P.g; }
      else if (quiz.done && i === quiz.picked) { bg = "#5a1f2e"; bd = P.r; }
      ctx.fillStyle = bd; ctx.fillRect(60, y, 780, 46); ctx.fillStyle = bg; ctx.fillRect(63, y + 3, 774, 40);
      text((i + 1) + ".  " + o.t, 78, y + 29, 16, P.w);
    });
    const by = top + 3 * 56 + 22;
    if (quiz.done) {
      text(quiz.right ? "ВЕРНО!  +300 очков" : "Не совсем. Вот как на самом деле:", 450, by, 19, quiz.right ? P.g : P.R, "center");
      wrap(quiz.why, 80).forEach((ln, i) => text(ln, 450, by + 28 + i * 21, 15, P.s, "center"));
      if (((t * 2) | 0) % 2 === 0) text("ENTER — ДАЛЬШЕ", 450, 585, 22, P.w, "center");
    } else text("Нажми 1, 2 или 3  (или ↑ ↓ и ENTER)", 450, by + 6, 16, P.s, "center");
  } else if (state === "win") {
    ctx.fillStyle = "#0b0b12"; ctx.fillRect(0, 0, 900, 600);
    drawCert(ctx, playerName);
    ctx.fillStyle = P.B; ctx.fillRect(CERT_BTN.x, CERT_BTN.y, CERT_BTN.w, CERT_BTN.h);
    ctx.fillStyle = "#1b2a4a"; ctx.fillRect(CERT_BTN.x + 3, CERT_BTN.y + 3, CERT_BTN.w - 6, CERT_BTN.h - 6);
    text("СОХРАНИТЬ PNG (S)", CERT_BTN.x + CERT_BTN.w / 2, CERT_BTN.y + 28, 16, P.w, "center");
    ctx.fillStyle = P.g; ctx.fillRect(SHARE_BTN.x, SHARE_BTN.y, SHARE_BTN.w, SHARE_BTN.h);
    ctx.fillStyle = "#1b4d3a"; ctx.fillRect(SHARE_BTN.x + 3, SHARE_BTN.y + 3, SHARE_BTN.w - 6, SHARE_BTN.h - 6);
    text("ПОДЕЛИТЬСЯ (D)", SHARE_BTN.x + SHARE_BTN.w / 2, SHARE_BTN.y + 28, 16, P.w, "center");
    if (shareNote && Date.now() < shareNote.until) text(shareNote.text, 450, 541, 13, P.y, "center");
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ИГРАТЬ СНОВА", 880, 576, 17, P.w, "right");
  } else if (state === "name") {
    ctx.fillStyle = "rgba(15,15,27,.95)"; ctx.fillRect(0, 0, 900, 600);
    ctx.drawImage(officer, 414, 90, 72, 72);
    text("КАК ВАС ЗОВУТ?", 450, 230, 38, P.y, "center");
    text("Имя будет указано на именном сертификате в конце игры.", 450, 266, 16, P.s, "center");
    ctx.fillStyle = P.B; ctx.fillRect(200, 300, 500, 60); ctx.fillStyle = "#1b2a4a"; ctx.fillRect(203, 303, 494, 54);
    const cur = ((t * 2) | 0) % 2 === 0 ? "_" : " ";
    text(playerName + cur, 450, 342, 28, P.w, "center");
    text("Введите имя с клавиатуры (до 24 знаков) или нажмите на экран.", 450, 400, 15, P.s, "center");
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ДАЛЕЕ", 450, 500, 26, P.w, "center");
    text("Можно оставить пустым: тогда на сертификате будет «Участник тренажёра».", 450, 545, 13, P.S, "center");
  } else if (state === "levels") {
    ctx.fillStyle = "rgba(15,15,27,.96)"; ctx.fillRect(0, 0, 900, 600);
    text("ВЫБОР УРОВНЯ", 450, 80, 36, P.y, "center");
    text("Прогресс сохраняется. Открыто: " + unlocked + " из " + MAXLVL, 450, 115, 16, P.s, "center");
    for (let i = 0; i < MAXLVL; i++) {
      const x = 75 + (i % 5) * 150, y = (MAXLVL <= 5 ? 230 : 170) + Math.floor(i / 5) * 150, open = i < unlocked;
      ctx.fillStyle = i === lvlSel ? P.B : P.S; ctx.fillRect(x, y, 130, 120);
      ctx.fillStyle = open ? "#1b2a4a" : "#14141c"; ctx.fillRect(x + 3, y + 3, 124, 114);
      text(String(i + 1), x + 65, y + 72, 44, open ? P.w : P.S, "center");
      text(!open ? "ЗАКРЫТ" : i + 1 < unlocked ? "ПРОЙДЕН" : "ТЕКУЩИЙ", x + 65, y + 100, 13, !open ? P.S : i + 1 < unlocked ? P.g : P.y, "center");
    }
    text("← → ↑ ↓ выбор · ENTER — начать · ESC — назад", 450, 530, 15, P.s, "center");
    text("← НАЗАД", 20, 585, 14, P.s);
  } else if (state === "ach") {
    ctx.fillStyle = "rgba(15,15,27,.96)"; ctx.fillRect(0, 0, 900, 600);
    text("ДОСТИЖЕНИЯ", 450, 62, 34, P.y, "center");
    text("Открыто: " + achCount() + " из " + ACH.length, 450, 92, 15, P.s, "center");
    ACH.forEach((a, i) => {
      const y = 125 + i * 52, got = !!ach[a.id];
      ctx.fillStyle = got ? P.y : P.S; ctx.beginPath(); ctx.arc(95, y + 16, 17, 0, 6.3); ctx.fill();
      text(got ? "✓" : "?", 95, y + 24, 22, got ? P.k : P.n, "center");
      text(a.t, 130, y + 14, 17, got ? P.w : P.S); text(a.d, 130, y + 34, 13, got ? P.s : P.S);
    });
    text("ENTER — назад", 450, 585, 20, P.w, "center");
  } else if (state === "review") {
    ctx.fillStyle = "rgba(15,15,27,.96)"; ctx.fillRect(0, 0, 900, 600);
    text("РАЗБОР ОШИБОК", 450, 60, 32, P.y, "center");
    const list = topicsWrong().slice(0, 5);
    text(list.length ? "Темы, в которых были ошибки, и короткие памятки:" : "Ошибок не было — отличный результат!", 450, 92, 15, P.s, "center");
    list.forEach((tp, i) => {
      const y = 140 + i * 84;
      ctx.fillStyle = P.R; ctx.fillRect(60, y - 20, 5, 62);
      text(tp + "  (ошибок: " + wrongTopics[tp] + ")", 80, y, 17, P.y);
      wrap(TIPS[tp] || "", 84).forEach((ln, j) => text(ln, 80, y + 24 + j * 20, 14, P.w));
    });
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ДАЛЕЕ", 450, 585, 22, P.w, "center");
  } else if (state === "safe" || state === "win") {
    const win = state === "win", ok = win || safeAll;
    ctx.fillStyle = "rgba(15,15,27,.94)"; ctx.fillRect(0, 0, 900, 600);
    text(win ? "ВСЕ " + MAXLVL + " УРОВНЕЙ ПРОЙДЕНЫ!" : ok ? "ВАШИ ДЕНЬГИ И ДАННЫЕ В БЕЗОПАСНОСТИ" : "ЗАЩИТА ПОКА НЕПОЛНАЯ", 450, 64, win ? 34 : 28, ok ? P.y : P.R, "center");
    text(win ? "Клиенты защищены. Счёт: " + score + " · Оберегов: " + amulets
             : ok ? "Уровень " + level + ": все ответы верны. Оберег получен, +1 жизнь."
                  : "Верных ответов: " + lvlRight + " из " + quizN + ". Запомните правило ниже.", 450, 98, 16, P.s, "center");
    drawSafe(450, 300, ok);
    text("Запрос комплаенса — это приложение и документы.", 450, 465, 16, P.w, "center");
    text("Пароли, коды из СМС и переводы «на безопасный счёт» — никогда.", 450, 489, 16, P.w, "center");
    if (win) text("Поймано угроз: " + kills + " · Квиз: " + quizRight + " из " + quizTotal, 450, 524, 15, P.B, "center");
    if (((t * 2) | 0) % 2 === 0) text(win ? "ENTER — ИГРАТЬ СНОВА" : "ENTER — УРОВЕНЬ " + (level + 1), 450, 580, 24, P.w, "center");
  } else if (state === "pause") {
    ctx.fillStyle = "rgba(15,15,27,.7)"; ctx.fillRect(0, 0, 900, 600);
    text("ПАУЗА", 450, 310, 48, P.w, "center");
    text("P или тап — продолжить", 450, 350, 16, P.s, "center");
  } else if (state === "over") {
    ctx.fillStyle = "rgba(15,15,27,.82)"; ctx.fillRect(0, 0, 900, 600);
    text("ИГРА ОКОНЧЕНА", 450, 150, 44, P.r, "center");
    text("Слишком много угроз пропущено. Попробуйте ещё раз!", 450, 195, 17, P.w, "center");
    text("Счёт: " + score + "   Рекорд: " + best + "   Уровень: " + level, 450, 245, 19, P.y, "center");
    text("Поймано плохих: " + kills, 450, 290, 17, P.g, "center");
    text("Пропущено плохих: " + missed, 450, 318, 17, P.R, "center");
    text("Сбито честных: " + falsePos, 450, 346, 17, P.o, "center");
    text("Квиз: верно " + quizRight + " из " + quizTotal + "   Обереги: " + amulets, 450, 374, 17, P.B, "center");
    text("Помните: настоящий комплаенс не просит пароли и коды из СМС.", 450, 420, 15, P.s, "center");
    if (((t * 2) | 0) % 2 === 0) text("ENTER — ЕЩЁ РАЗ (УРОВЕНЬ " + level + ")", 450, 485, 24, P.w, "center");
    text("H — справка · L — выбор уровня" + (topicsWrong().length ? " · R — разбор ошибок" : "") + " · A — достижения", 450, 525, 14, P.s, "center");
  }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); drawAchPopup(); music();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
